[project]
name = "accounting-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Lin Gatra",email = "kotyng.me@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.12,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
]


[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
unfixable = ["B"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["app", "tests"]
