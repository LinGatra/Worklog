services:
  # --- prod ---
  db-prod:
    container_name: postgres_db_prod
    image: postgres:16-alpine
    env_file: .env.prod
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles: [ 'prod' ]

  alembic-prod:
    container_name: alembic_prod
    build:
      context: .
      target: prod
    networks:
      - app_network
    restart: "no"
    command: alembic upgrade head
    env_file: .env.prod
    depends_on:
      db-prod:
        condition: service_healthy
    profiles: [ 'prod' ]

  worklog-prod:
    build:
      context: .
      target: prod
    env_file: .env.prod
    command: uvicorn app.main:app --host ${APP_HOST} --port ${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - app_network
    depends_on:
      alembic-prod:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${APP_PORT}/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: [ 'prod' ]

  # --- dev ---
  db-dev:
    container_name: postgres_db_dev
    image: postgres:16-alpine
    env_file: .env.dev
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - 15615:5432
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles: [ 'dev' ]

  alembic-dev:
    container_name: alembic_dev
    build:
      context: .
      target: dev
    networks:
      - app_network
    volumes:
      - ./alembic/versions:/worklog/alembic/versions
    restart: "no"
    command: alembic upgrade head
    env_file: .env.dev
    depends_on:
      db-dev:
        condition: service_healthy
    profiles: [ 'dev' ]

  worklog-dev:
    build:
      context: .
      target: dev
    env_file: .env.dev
    command: uvicorn app.main:app --host ${APP_HOST} --port ${APP_PORT} --reload
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - app_network
    depends_on:
      alembic-dev:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${APP_PORT}/health')" ]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./app
          target: /worklog/app
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: poetry.lock
    profiles: [ 'dev' ]

volumes:
  pgdata_dev:
  pgdata_prod:

networks:
  app_network:
    driver: bridge
