version: '5.1'
services:
  db:
    container_name: postgres_db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d app_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  alembic:
    container_name: alembic
    build: .
    networks:
      - app_network
    restart: "no"
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  app:
    container_name: accounting_service
    build: .
    env_file: .env
    command: uvicorn app.main:app --host ${APP_HOST} --port ${APP_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - app_network
    depends_on:
      alembic:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${APP_PORT}/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:

networks:
  app_network:
    driver: bridge
